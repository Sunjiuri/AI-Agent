spring:
  application:
    name: ai-agent

  ai:
    openai:
      # Set via environment variable: SPRING_AI_OPENAI_API_KEY
      api-key: ${SPRING_AI_OPENAI_API_KEY:demo-key}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
          max-tokens: 2048

  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.aiagent: DEBUG
    org.springframework.ai: INFO
